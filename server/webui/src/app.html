<!doctype html>
<html
	lang="en"
	data-theme="frosted-glass"
	class="light has-frosted-glass-theme has-frosted-glass-wallpaper-milk"
>
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<!-- The theme runtime checks persistent wallpaper storage before exposing an image URL. -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="llampart-theme-preload-background" aria-hidden="true"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
